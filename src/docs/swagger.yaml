openapi: 3.0.0
info:
  title: Air BNB Wishlist API
  description: API for managing user wishlists on the Air BNB clone application.
  version: 1.0.0
servers:
  - url: /api
paths:
  /wishlist:
    get:
      summary: Get user's wishlist
      description: Retrieves the list of all properties in the current user's wishlist.
      responses:
        '200':
          description: A list of properties in the wishlist.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Property'
    post:
      summary: Toggle a property in the wishlist
      description: Adds a property to the wishlist if it's not already there, or removes it if it is.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                propertyId:
                  type: string
                  description: The ID of the property to toggle.
      responses:
        '200':
          description: The property was successfully added or removed from the wishlist.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
                  wishlist:
                    type: array
                    items:
                      $ref: '#/components/schemas/Property'
        '404':
          description: Property not found.

components:
  schemas:
    Property:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the property.
        title:
          type: string
          description: Title of the property listing.
        location:
          type: string
          description: City and country of the property.
        price:
          type: number
          description: Price per night.
        rating:
          type: number
          format: float
          description: Average user rating.
        guests:
          type: integer
          description: Maximum number of guests.
        bedrooms:
          type: integer
          description: Number of bedrooms.
        beds:
          type: integer
          description: Number of beds.
        baths:
          type: integer
          description: Number of bathrooms.
        images:
          type: array
          items:
            type: string
            format: url
          description: List of URLs for property images.
        description:
          type: string
          description: Detailed description of the property.
        amenities:
          type: array
          items:
            type: string
          description: List of available amenities.
        host:
          type: object
          properties:
            name:
              type: string
            avatar:
              type: string
              format: url
    Error:
      type: object
      properties:
        message:
          type: string
          description: A human-readable error message.
